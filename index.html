    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Neue Haas Grotesk Display Pro 55 Roman', 'Neue Haas Grotesk Text Pro', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #0d120d;
    }

    /* Keyframe for continuous boomerang zoom breathing effect */
    @keyframes boomerangZoom {
      0% {
        transform: scale(1) translate(0, 0);
      }
      50% {
        transform: scale(1.15) translate(-1%, -1%);
      }
      100% {
        transform: scale(1) translate(0, 0);
      }
    }

    .animate-boomerang-zoom {
      animation: boomerangZoom 18s ease-in-out infinite;
      will-change: transform;
    }

    .animate-paused {
      animation-play-state: paused;
    }

    /* Custom Glassmorphism effects */
    .glass-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .glass-dark {
      background: rgba(18, 26, 17, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* WhatsApp Shine Effect Keyframe */
    @keyframes shineSweep {
      0% { transform: translateX(-100%) rotate(25deg); }
      30%, 100% { transform: translateX(250%) rotate(25deg); }
    }

    .animate-shine {
      position: relative;
      overflow: hidden;
    }
    
    .animate-shine::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 60%;
      height: 200%;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: shineSweep 3.5s infinite ease-in-out;
      pointer-events: none;
    }

    /* Custom scrollbar for mobile container */
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.1);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(133, 171, 139, 0.5);
      border-radius: 4px;
    }
  </style>
</head>
