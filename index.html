<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkFlow - Close the rift linking signals and action</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://db.onlinewebfonts.com/c/6e47ef470dd19698c911332a9b4d1cf4?family=Neue+Haas+Grotesk+Text+Pro" rel="stylesheet" />
  <link href="https://db.onlinewebfonts.com/c/dec0d9b4e22ca588dc20e1e2e09a59b5?family=Neue+Haas+Grotesk+Display+Pro+55+Roman" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & Babel scripts -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Custom styles and keyframe animations -->
  <style>
    html, body, #root {
      height: 100%;
      margin: 0;
      font-family: 'Neue Haas Grotesk Display Pro 55 Roman', 'Neue Haas Grotesk Text Pro', 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Keyframe for continuous boomerang zoom breathing effect */
    @keyframes boomerangZoom {
      0% {
        transform: scale(1) translate(0, 0);
      }
      50% {
        transform: scale(1.15) translate(-1%, -1%);
      }
      100% {
        transform: scale(1) translate(0, 0);
      }
    }

    .animate-boomerang-zoom {
      animation: boomerangZoom 20s ease-in-out infinite;
      will-change: transform;
    }

    .animate-paused {
      animation-play-state: paused;
    }

    /* Custom Glassmorphism effects */
    .glass-card {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .glass-dark {
      background: rgba(25, 34, 24, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Subtle pulse keyframe */
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .animate-pulse-subtle {
      animation: subtlePulse 4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#0f150f] text-[#1f2a1d] overflow-x-hidden flex items-center justify-center min-h-screen p-0 sm:p-4 md:p-6 selection:bg-[#85AB8B] selection:text-white">

  <div id="root" class="w-full flex items-center justify-center"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Lucide-compatible Icon Components
    const IconLogIn = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
      </svg>
    );

    const IconUserPlus = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
      </svg>
    );

    const IconPlay = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="currentColor" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z" />
      </svg>
    );

    const IconSparkles = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
      </svg>
    );

    const IconMenu = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    );

    const IconX = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    );

    const IconArrowRight = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
      </svg>
    );

    const IconCheckCircle = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconZap = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    );

    const BACKGROUND_IMAGE_URL = 'https://i.postimg.cc/dV0SYNRV/1785089625833.png';

    function ZoomingImageBg({ src, isPaused }) {
      const [loaded, setLoaded] = useState(false);

      return (
        <div className="absolute inset-0 w-full h-full overflow-hidden bg-[#1f2a1d]">
          {/* Main Zooming Background Image - Cover mode within 480px container */}
          <div 
            className={`w-full h-full transform-gpu transition-opacity duration-1000 animate-boomerang-zoom ${
              isPaused ? 'animate-paused' : ''
            } ${loaded ? 'opacity-100' : 'opacity-0'}`}
            style={{ transformOrigin: '50% 50%' }}
          >
            <img 
              src={src} 
              alt="LinkFlow Mobile Hero Canvas" 
              className="w-full h-full object-cover object-center scale-105"
              onLoad={() => setLoaded(true)}
            />
          </div>

          {/* Vignette Overlay for maximum contrast and legibility */}
          <div className="absolute inset-0 bg-gradient-to-t from-[#1f2a1d]/90 via-transparent to-[#1f2a1d]/50 pointer-events-none" />
          <div className="absolute inset-0 bg-gradient-to-r from-[#1f2a1d]/40 via-transparent to-[#1f2a1d]/40 pointer-events-none" />
          
          {/* Ambient Glow Effect */}
          <div className="absolute top-1/3 left-1/2 -translate-x-1/2 w-[320px] h-[200px] bg-[#85AB8B]/25 rounded-full blur-[90px] pointer-events-none animate-pulse-subtle" />
        </div>
      );
    }

    function App() {
      const [menuOpen, setMenuOpen] = useState(false);
      const [zoomPaused, setZoomPaused] = useState(false);
      const [activeModal, setActiveModal] = useState(null); // 'demo', 'knowMore', 'video', 'auth', 'navSection'
      const [modalSection, setModalSection] = useState('purpose');
      const [authTab, setAuthTab] = useState('signup');
      
      // Demo Workflow state
      const [selectedSignal, setSelectedSignal] = useState('Slack Channel Event');
      const [workflowStatus, setWorkflowStatus] = useState('idle');

      const navLinks = [
        { href: '#purpose', key: 'purpose', label: 'Propósito' },
        { href: '#process', key: 'process', label: 'El Proceso' },
        { href: '#pricing', key: 'pricing', label: 'Tarifas' },
      ];

      const handleNavClick = (key) => {
        setModalSection(key);
        setActiveModal('navSection');
        setMenuOpen(false);
      };

      const handleRunDemo = () => {
        setWorkflowStatus('processing');
        setTimeout(() => {
          setWorkflowStatus('completed');
        }, 1500);
      };

      return (
        /* Mobile Card Wrapper: Centered on screen, max-w-[480px], 4:5 optimized frame */
        <main className="relative w-full max-w-[480px] h-[100dvh] sm:h-[840px] max-h-[100dvh] sm:max-h-[92vh] sm:rounded-[36px] overflow-hidden shadow-2xl border-0 sm:border border-white/20 flex flex-col justify-between selection:bg-[#85AB8B] selection:text-white bg-[#1f2a1d]">
          
          {/* Dynamic Boomerang Zoom Background */}
          <ZoomingImageBg 
            src={BACKGROUND_IMAGE_URL} 
            isPaused={zoomPaused} 
          />

          {}
          <nav className="relative z-30 flex items-center justify-between px-5 pt-5 pb-2">
            {/* Logo */}
            <div className="flex items-center gap-1.5 text-[#1f2a1d]">
              <span className="text-xl font-bold tracking-tight text-[#1f2a1d] drop-shadow-sm flex items-center gap-1.5">
                <span className="bg-[#1f2a1d] text-white px-2 py-0.5 rounded-lg text-xs font-mono">LF</span>
                LinkFlow<sup className="text-[9px] font-semibold opacity-80">TM</sup>
              </span>
            </div>

            {/* Quick Action Badges & Mobile Menu Toggle */}
            <div className="flex items-center gap-2">
              <button 
                onClick={() => { setAuthTab('login'); setActiveModal('auth'); }}
                className="flex items-center gap-1.5 text-xs font-semibold text-[#1f2a1d] bg-white/70 hover:bg-white/90 px-3 py-1.5 rounded-full backdrop-blur-md border border-white/60 shadow-sm transition-all active:scale-95"
              >
                <IconLogIn className="w-3.5 h-3.5 text-[#336443]" />
                Ingresar
              </button>

              <button
                onClick={() => setMenuOpen((v) => !v)}
                className="relative flex items-center justify-center w-9 h-9 rounded-full bg-white/80 backdrop-blur-md border border-white/70 text-[#1f2a1d] shadow-sm transition-all duration-300 hover:bg-white active:scale-95"
                aria-label={menuOpen ? 'Cerrar menú' : 'Abrir menú'}
              >
                <IconMenu
                  className={`w-4 h-4 absolute transition-all duration-300 ${
                    menuOpen ? 'opacity-0 rotate-90 scale-50' : 'opacity-100 rotate-0 scale-100'
                  }`}
                />
                <IconX
                  className={`w-4 h-4 absolute transition-all duration-300 ${
                    menuOpen ? 'opacity-100 rotate-0 scale-100' : 'opacity-0 -rotate-90 scale-50'
                  }`}
                />
              </button>
            </div>
          </nav>

          {}
          <div
            className={`absolute inset-0 z-40 transition-opacity duration-300 ${
              menuOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'
            }`}
            onClick={() => setMenuOpen(false)}
          >
            <div className="absolute inset-0 bg-[#1f2a1d]/60 backdrop-blur-md" />
          </div>

          <div
            className={`absolute top-0 right-0 bottom-0 z-50 w-[82%] bg-white/95 backdrop-blur-2xl shadow-2xl transition-transform duration-500 ease-[cubic-bezier(0.22,1,0.36,1)] ${
              menuOpen ? 'translate-x-0' : 'translate-x-full'
            }`}
          >
            <div className="flex flex-col h-full pt-16 px-6 pb-6 justify-between">
              <div className="flex flex-col gap-2">
                <span className="text-[10px] uppercase tracking-widest text-[#4b5b47] font-bold mb-1">Menú LinkFlow</span>
                {navLinks.map((link, i) => (
                  <button
                    key={link.key}
                    onClick={() => handleNavClick(link.key)}
                    className={`text-left text-xl font-bold text-[#1f2a1d] py-3 border-b border-[#1f2a1d]/10 transition-all duration-500 flex items-center justify-between ${
                      menuOpen ? 'translate-x-0 opacity-100' : 'translate-x-8 opacity-0'
                    }`}
                    style={{ transitionDelay: menuOpen ? `${150 + i * 70}ms` : '0ms' }}
                  >
                    <span>{link.label}</span>
                    <IconArrowRight className="w-4 h-4 text-[#85AB8B]" />
                  </button>
                ))}
              </div>

              <div
                className={`flex flex-col gap-2.5 transition-all duration-500 ${
                  menuOpen ? 'translate-x-0 opacity-100' : 'translate-x-8 opacity-0'
                }`}
                style={{ transitionDelay: menuOpen ? '380ms' : '0ms' }}
              >
                <button 
                  onClick={() => { setAuthTab('signup'); setActiveModal('auth'); setMenuOpen(false); }}
                  className="flex items-center justify-center gap-2 text-xs font-semibold text-[#1f2a1d] bg-[#1f2a1d]/5 hover:bg-[#1f2a1d]/10 py-2.5 rounded-xl transition-colors"
                >
                  <IconUserPlus className="w-4 h-4 text-[#336443]" />
                  Crear Cuenta
                </button>
                <button 
                  onClick={() => { setActiveModal('demo'); setMenuOpen(false); }}
                  className="bg-[#1f2a1d] hover:bg-[#2a3827] text-white text-xs font-semibold px-4 py-3 rounded-full transition-all shadow-md flex items-center justify-center gap-2"
                >
                  <IconZap className="w-3.5 h-3.5 text-[#85AB8B]" />
                  Pruébalo en Vivo
                </button>
              </div>
            </div>
          </div>

          {}
          <div className="relative z-10 flex flex-col items-center text-center px-5 my-auto pt-2">
            
            {/* Tagline Badge */}
            <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/65 backdrop-blur-md border border-white/75 shadow-sm mb-4">
              <span className="w-1.5 h-1.5 rounded-full bg-[#336443] animate-ping" />
              <span className="text-[10px] font-bold text-[#1f2a1d] tracking-wide uppercase">AI-Driven Signal Engine</span>
            </div>

            <h1
              className="font-normal leading-[1.05] text-[#1f2a1d] text-[2.1rem] xs:text-[2.3rem] tracking-tight drop-shadow-sm max-w-xs"
              style={{ letterSpacing: '-0.03em' }}
            >
              Cierra la brecha{' '}
              <span className="text-[#336443] font-medium block">
                conectando
              </span>{' '}
              <span className="text-[#85AB8B] italic font-serif">
                señales y acción
              </span>
            </h1>

            <p className="mt-3.5 text-[#2d3a2a] text-xs leading-relaxed max-w-[280px] font-normal drop-shadow-sm">
              Transforma eventos dispersos en flujos automatizados con inteligencia artificial.
            </p>

            {/* Boomerang Animation Control Toggle */}
            <button 
              onClick={() => setZoomPaused(!zoomPaused)}
              className="mt-4 inline-flex items-center gap-1.5 text-[10px] font-semibold text-[#1f2a1d] bg-white/45 hover:bg-white/70 backdrop-blur-sm px-2.5 py-1 rounded-full transition-all border border-white/50"
            >
              <span className={`w-1.5 h-1.5 rounded-full ${zoomPaused ? 'bg-amber-500' : 'bg-emerald-500 animate-pulse'}`} />
              EFECTO BOOMERANG: {zoomPaused ? 'PAUSADO' : 'ACTIVO'}
            </button>
          </div>

          {}
          <div className="relative z-10 px-4 pb-4 pt-2 flex flex-col gap-2.5">
            
            {/* Bottom Card Block */}
            <div className="glass-card p-4 rounded-2xl shadow-lg border border-white/80 transition-transform duration-300">
              <div className="flex items-center gap-1.5 text-[#1f2a1d] mb-1.5">
                <IconSparkles className="w-3.5 h-3.5 text-[#336443]" />
                <span className="text-xs font-bold tracking-tight text-[#1f2a1d]">
                  FluxEngine<sup className="text-[8px]">TM</sup>
                </span>
                <span className="ml-auto text-[9px] font-mono bg-[#336443]/10 text-[#336443] px-2 py-0.5 rounded-full font-semibold">
                  v2.4 Ready
                </span>
              </div>
              
              <p className="text-[#4b5b47] text-[11px] leading-snug mb-3 font-normal">
                Conecta tus sistemas en tiempo real sin escribir código o scripts complejos.
              </p>

              <div className="flex items-center gap-2 justify-between">
                <button 
                  onClick={() => setActiveModal('demo')}
                  className="flex-1 bg-[#1f2a1d] hover:bg-[#2a3827] text-white text-xs font-semibold py-2 px-3 rounded-full transition-all shadow-md active:scale-95 text-center"
                >
                  Pruébalo en Vivo
                </button>
                <button 
                  onClick={() => setActiveModal('knowMore')}
                  className="px-2 text-[#1f2a1d] hover:text-[#336443] text-xs font-semibold transition-colors underline underline-offset-2 decoration-[#85AB8B]"
                >
                  Saber Más
                </button>
              </div>
            </div>

            {/* Video Link */}
            <button 
              onClick={() => setActiveModal('video')}
              className="w-full flex items-center justify-between bg-white/70 hover:bg-white/90 backdrop-blur-md px-3.5 py-2 rounded-xl shadow-sm border border-white/80 transition-all text-xs text-[#1f2a1d]"
            >
              <div className="flex items-center gap-2 font-bold">
                <span className="flex items-center justify-center w-6 h-6 rounded-full bg-[#1f2a1d] text-white">
                  <IconPlay className="w-3 h-3 ml-0.5" />
                </span>
                ¿Cómo lo construimos?
              </div>
              <span className="text-[10px] font-semibold text-[#4b5b47]">Ver 1:35</span>
            </button>
          </div>

          {}

          {/* Modal: Interactive Live Demo */}
          {activeModal === 'demo' && (
            <div className="absolute inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/60 backdrop-blur-md" onClick={() => setActiveModal(null)} />
              
              <div className="relative w-full glass-dark text-white p-5 rounded-2xl shadow-2xl border border-white/20 z-10 max-h-[90%] overflow-y-auto">
                <button 
                  onClick={() => setActiveModal(null)}
                  className="absolute top-4 right-4 text-white/70 hover:text-white p-1 rounded-full hover:bg-white/10"
                >
                  <IconX className="w-4 h-4" />
                </button>

                <div className="flex items-center gap-1.5 text-[#85AB8B] mb-1">
                  <IconZap className="w-4 h-4" />
                  <span className="text-[10px] uppercase font-bold tracking-widest">Demostración en Vivo</span>
                </div>

                <h3 className="text-lg font-bold text-white mb-1">Simulador FluxEngine™</h3>
                <p className="text-white/70 text-xs mb-4">
                  Selecciona una señal para procesarla en tiempo real.
                </p>

                {/* Signal Selector */}
                <div className="space-y-2 mb-4">
                  <label className="text-[10px] font-semibold text-white/80 block uppercase tracking-wider">
                    1. Señal de entrada:
                  </label>
                  {['Slack Channel Event', 'Webhook Stripe', 'Lead Salesforce'].map((signal) => (
                    <button
                      key={signal}
                      onClick={() => { setSelectedSignal(signal); setWorkflowStatus('idle'); }}
                      className={`w-full text-left p-2.5 rounded-lg border text-xs font-medium transition-all flex items-center justify-between ${
                        selectedSignal === signal 
                          ? 'bg-[#85AB8B]/20 border-[#85AB8B] text-white' 
                          : 'bg-white/5 border-white/10 text-white/70 hover:bg-white/10'
                      }`}
                    >
                      <span>{signal}</span>
                      {selectedSignal === signal && <IconCheckCircle className="w-3.5 h-3.5 text-[#85AB8B]" />}
                    </button>
                  ))}
                </div>

                {/* Simulation Output */}
                <div className="bg-black/50 rounded-xl p-3 border border-white/10 mb-4 font-mono text-[11px]">
                  <div className="text-white/50 mb-1">// Estado:</div>
                  {workflowStatus === 'idle' && (
                    <div className="text-amber-400">Listo para [{selectedSignal}]</div>
                  )}
                  {workflowStatus === 'processing' && (
                    <div className="text-sky-400 animate-pulse flex items-center gap-1.5">
                      <span className="w-2 h-2 rounded-full bg-sky-400 animate-ping" />
                      Procesando con AI Agents...
                    </div>
                  )}
                  {workflowStatus === 'completed' && (
                    <div className="text-emerald-400 flex items-center gap-1">
                      <IconCheckCircle className="w-3.5 h-3.5" />
                      Acción ejecutada en 14ms.
                    </div>
                  )}
                </div>

                <div className="flex gap-2">
                  <button
                    onClick={handleRunDemo}
                    disabled={workflowStatus === 'processing'}
                    className="flex-1 bg-[#85AB8B] hover:bg-[#6e9374] text-[#1f2a1d] font-bold py-2.5 px-3 rounded-xl transition-all text-center text-xs shadow-md"
                  >
                    {workflowStatus === 'processing' ? 'Procesando...' : 'Ejecutar'}
                  </button>
                  <button
                    onClick={() => setActiveModal(null)}
                    className="px-4 py-2.5 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-medium"
                  >
                    Cerrar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal: Video Breakdown */}
          {activeModal === 'video' && (
            <div className="absolute inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setActiveModal(null)} />
              
              <div className="relative w-full glass-dark text-white p-5 rounded-2xl shadow-2xl border border-white/20 z-10">
                <button 
                  onClick={() => setActiveModal(null)}
                  className="absolute top-4 right-4 text-white/70 hover:text-white p-1 rounded-full hover:bg-white/10 z-20"
                >
                  <IconX className="w-4 h-4" />
                </button>

                <h3 className="text-base font-bold text-white mb-3 flex items-center gap-1.5">
                  <IconPlay className="w-4 h-4 text-[#85AB8B]" />
                  Arquitectura LinkFlow (1:35)
                </h3>

                <div className="relative aspect-video bg-black rounded-xl overflow-hidden border border-white/10 flex flex-col items-center justify-center p-4 text-center group">
                  <img 
                    src={BACKGROUND_IMAGE_URL} 
                    alt="Video Preview" 
                    className="absolute inset-0 w-full h-full object-cover opacity-40 blur-sm scale-105"
                  />
                  <div className="relative z-10">
                    <span className="w-12 h-12 rounded-full bg-[#85AB8B] text-[#1f2a1d] flex items-center justify-center mx-auto mb-2 shadow-lg transition-transform group-hover:scale-110 cursor-pointer">
                      <IconPlay className="w-6 h-6 ml-0.5" />
                    </span>
                    <h4 className="text-xs font-bold text-white">Pipelines de Inteligencia Artificial</h4>
                    <p className="text-[10px] text-white/70 mt-1">
                      Captura microsegunda de señales de red y orquestación automática.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Modal: Know More */}
          {activeModal === 'knowMore' && (
            <div className="absolute inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/60 backdrop-blur-md" onClick={() => setActiveModal(null)} />
              
              <div className="relative w-full glass-card text-[#1f2a1d] p-5 rounded-2xl shadow-2xl border border-white/80 z-10">
                <button 
                  onClick={() => setActiveModal(null)}
                  className="absolute top-4 right-4 text-[#1f2a1d]/70 hover:text-[#1f2a1d] p-1 rounded-full hover:bg-black/5"
                >
                  <IconX className="w-4 h-4" />
                </button>

                <div className="flex items-center gap-1.5 text-[#336443] mb-1">
                  <IconSparkles className="w-4 h-4" />
                  <span className="text-[10px] font-bold uppercase tracking-wider">Descubre FluxEngine™</span>
                </div>

                <h3 className="text-lg font-bold text-[#1f2a1d] mb-2">Orquestación Sin Fricción</h3>
                
                <div className="space-y-2 text-xs text-[#4b5b47] mb-4">
                  <p>
                    <strong>FluxEngine™</strong> analiza eventos en tiempo real, filtra ruido y enruta datos directamente a tus aplicaciones.
                  </p>
                  <div className="grid grid-cols-2 gap-2 pt-1">
                    <div className="p-2 bg-white/80 rounded-lg border border-black/5">
                      <span className="block text-[10px] font-bold text-[#1f2a1d]">Integración Directa</span>
                      <span className="text-[10px] text-[#4b5b47]">+200 conectores nativos.</span>
                    </div>
                    <div className="p-2 bg-white/80 rounded-lg border border-black/5">
                      <span className="block text-[10px] font-bold text-[#1f2a1d]">Seguridad SOC2</span>
                      <span className="text-[10px] text-[#4b5b47]">Cifrado total E2E.</span>
                    </div>
                  </div>
                </div>

                <button
                  onClick={() => { setActiveModal('demo'); }}
                  className="w-full bg-[#1f2a1d] hover:bg-[#2a3827] text-white font-semibold py-2.5 px-3 rounded-xl transition-all shadow-md text-xs"
                >
                  Probar FluxEngine™
                </button>
              </div>
            </div>
          )}

          {/* Modal: Nav Section detail */}
          {activeModal === 'navSection' && (
            <div className="absolute inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/60 backdrop-blur-md" onClick={() => setActiveModal(null)} />
              
              <div className="relative w-full glass-card text-[#1f2a1d] p-5 rounded-2xl shadow-2xl border border-white/80 z-10">
                <button 
                  onClick={() => setActiveModal(null)}
                  className="absolute top-4 right-4 text-[#1f2a1d]/70 hover:text-[#1f2a1d] p-1 rounded-full hover:bg-black/5"
                >
                  <IconX className="w-4 h-4" />
                </button>

                {modalSection === 'purpose' && (
                  <div>
                    <span className="text-[10px] uppercase tracking-widest text-[#336443] font-bold">Propósito</span>
                    <h3 className="text-lg font-bold text-[#1f2a1d] mt-1 mb-2">Conecta Inteligencia y Acción</h3>
                    <p className="text-xs text-[#4b5b47] leading-relaxed mb-4">
                      Unifica tus herramientas operativas mediante agentes autónomos de IA sin escribir scripts.
                    </p>
                  </div>
                )}

                {modalSection === 'process' && (
                  <div>
                    <span className="text-[10px] uppercase tracking-widest text-[#336443] font-bold">El Proceso</span>
                    <h3 className="text-lg font-bold text-[#1f2a1d] mt-1 mb-2">3 Pasos de Automatización</h3>
                    <ul className="space-y-2 text-xs text-[#4b5b47] mb-4">
                      <li className="flex items-start gap-1.5"><strong className="text-[#336443]">1.</strong> Captura señales vía Webhooks.</li>
                      <li className="flex items-start gap-1.5"><strong className="text-[#336443]">2.</strong> FluxEngine™ enriquece la data.</li>
                      <li className="flex items-start gap-1.5"><strong className="text-[#336443]">3.</strong> Ejecución instantánea en destino.</li>
                    </ul>
                  </div>
                )}

                {modalSection === 'pricing' && (
                  <div>
                    <span className="text-[10px] uppercase tracking-widest text-[#336443] font-bold">Tarifas</span>
                    <h3 className="text-lg font-bold text-[#1f2a1d] mt-1 mb-2">Planes Flexibles</h3>
                    <div className="grid grid-cols-2 gap-2 my-3">
                      <div className="p-3 bg-white/90 rounded-xl border border-black/5">
                        <span className="text-[9px] font-bold text-[#4b5b47] uppercase">Starter</span>
                        <div className="text-xl font-bold text-[#1f2a1d] my-0.5">$0</div>
                        <span className="text-[10px] text-[#4b5b47]">1,000 eventos/mes</span>
                      </div>
                      <div className="p-3 bg-[#1f2a1d] text-white rounded-xl shadow-md">
                        <span className="text-[9px] font-bold text-[#85AB8B] uppercase">Pro Flux</span>
                        <div className="text-xl font-bold text-white my-0.5">$49</div>
                        <span className="text-[10px] text-white/70">Eventos ilimitados</span>
                      </div>
                    </div>
                  </div>
                )}

                <button
                  onClick={() => setActiveModal(null)}
                  className="w-full bg-[#1f2a1d] text-white font-semibold py-2 rounded-xl text-xs"
                >
                  Entendido
                </button>
              </div>
            </div>
          )}

          {/* Modal: Auth */}
          {activeModal === 'auth' && (
            <div className="absolute inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/60 backdrop-blur-md" onClick={() => setActiveModal(null)} />
              
              <div className="relative w-full glass-card text-[#1f2a1d] p-5 rounded-2xl shadow-2xl border border-white/80 z-10">
                <button 
                  onClick={() => setActiveModal(null)}
                  className="absolute top-4 right-4 text-[#1f2a1d]/70 hover:text-[#1f2a1d] p-1 rounded-full hover:bg-black/5"
                >
                  <IconX className="w-4 h-4" />
                </button>

                <div className="flex bg-[#1f2a1d]/10 p-1 rounded-xl mb-4">
                  <button
                    onClick={() => setAuthTab('signup')}
                    className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-all ${
                      authTab === 'signup' ? 'bg-white text-[#1f2a1d] shadow-sm' : 'text-[#4b5b47]'
                    }`}
                  >
                    Crear Cuenta
                  </button>
                  <button
                    onClick={() => setAuthTab('login')}
                    className={`flex-1 py-1.5 text-xs font-bold rounded-lg transition-all ${
                      authTab === 'login' ? 'bg-white text-[#1f2a1d] shadow-sm' : 'text-[#4b5b47]'
                    }`}
                  >
                    Iniciar Sesión
                  </button>
                </div>

                <form onSubmit={(e) => { e.preventDefault(); setActiveModal(null); }} className="space-y-3">
                  {authTab === 'signup' && (
                    <div>
                      <label className="block text-[10px] font-semibold text-[#4b5b47] mb-0.5">Nombre Completo</label>
                      <input 
                        type="text" 
                        placeholder="Alex Morgan" 
                        required 
                        className="w-full px-3 py-2 rounded-lg bg-white/80 border border-black/10 text-xs focus:outline-none focus:ring-2 focus:ring-[#336443]"
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-[10px] font-semibold text-[#4b5b47] mb-0.5">Correo Electrónico</label>
                    <input 
                      type="email" 
                      placeholder="alex@empresa.com" 
                      required 
                      className="w-full px-3 py-2 rounded-lg bg-white/80 border border-black/10 text-xs focus:outline-none focus:ring-2 focus:ring-[#336443]"
                    />
                  </div>

                  <div>
                    <label className="block text-[10px] font-semibold text-[#4b5b47] mb-0.5">Contraseña</label>
                    <input 
                      type="password" 
                      placeholder="••••••••" 
                      required 
                      className="w-full px-3 py-2 rounded-lg bg-white/80 border border-black/10 text-xs focus:outline-none focus:ring-2 focus:ring-[#336443]"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-[#1f2a1d] hover:bg-[#2a3827] text-white font-semibold py-2.5 rounded-xl transition-all shadow-md text-xs mt-1"
                  >
                    {authTab === 'signup' ? 'Comenzar Prueba Gratuita' : 'Acceder al Dashboard'}
                  </button>
                </form>
              </div>
            </div>
          )}

        </main>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
